[project]
name = "ai-fund"
version = "0.1.0"
description = "AI-native quantitative research and paper trading platform"
requires-python = ">=3.11"
dependencies = [
    # Data
    "duckdb>=0.10.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    # Market & macro data
    "yfinance>=0.2.40",
    "fredapi>=0.5.1",
    "requests>=2.31.0",
    # LLM
    "anthropic>=0.28.0",
    # CLI & config
    "typer>=0.12.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    # Logging
    "structlog>=24.1.0",
    # Portfolio math
    "cvxpy>=1.4.0",
    # Jinja2 for HTML reports
    "jinja2>=3.1.0",
    # Retry logic
    "tenacity>=8.3.0",
    # Date utilities
    "pandas-market-calendars>=4.4.0",
    # Parquet support
    "pyarrow>=14.0.0",
    # Testing
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    # Linting
    "ruff>=0.4.0",
    "scikit-learn>=1.8.0",
]

[project.scripts]
ai-fund = "cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingest", "execution", "orchestrator", "portfolio", "research"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short"
